services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: tasteroute
      POSTGRES_PASSWORD: tasteroute
      POSTGRES_DB: tasteroute
    ports:
      - "5432:5432"
    volumes:
      - tasteroute_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasteroute -d tasteroute"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - tasteroute_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  tasteroute_pg:
  tasteroute_redis:
